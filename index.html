<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バドミントン団体戦 オーダー作成</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#1b2a22;--mu:#66756d;--bd:#d8e2dc;--ac:#0f8a5f;--act:#fff;--wn:#1f9d6b;--wnbg:#dcf3e8;--no:#d6453d;--nobg:#fbe1df}
@media (prefers-color-scheme:dark){:root{--bg:#101a15;--card:#18241d;--tx:#e6efe9;--mu:#92a39a;--bd:#2c3d33;--ac:#2fb985;--act:#06281b;--wn:#4cd699;--wnbg:#15382b;--no:#ff7b72;--nobg:#3d1d1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.2rem;margin:4px 0 12px}h2{font-size:1.05rem;margin:16px 0 8px}h3{font-size:.95rem;margin:18px 0 4px;color:var(--ac)}
ol{display:flex;gap:4px;list-style:none;padding:0;margin:0 0 10px}
li{flex:1;text-align:center;font-size:.68rem;color:var(--mu);padding:6px 0;border-bottom:3px solid var(--bd)}
li b{display:block;font-size:.95rem}
li.on{color:var(--ac);border-color:var(--ac);font-weight:700}li.done{border-color:var(--ac)}
#v{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px 16px 16px}
label{display:block;margin:12px 0;font-size:.9rem;color:var(--mu)}
input{display:block;width:100%;margin-top:4px;padding:10px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
button{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:var(--act);font-weight:700}
.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1}
.mu{color:var(--mu);font-size:.85rem}.err{color:var(--no);font-size:.9rem;min-height:1em}
.mx{overflow-x:auto}table{border-collapse:collapse;margin:8px 0}
th{font-size:.72rem;font-weight:600;padding:4px;white-space:nowrap;text-align:left}
th.v{writing-mode:vertical-rl;vertical-align:bottom}
tr>th:first-child{position:sticky;left:0;background:var(--card)}
td{padding:2px;text-align:center}.dg{background:var(--bd)}
button.c{width:36px;height:36px;padding:0;border-radius:6px;font-weight:700}
.c1{background:var(--wnbg);color:var(--wn);border-color:var(--wn)}.c2{background:var(--nobg);color:var(--no);border-color:var(--no)}
.o{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;margin:6px 0;border:1px solid var(--bd);border-radius:10px}
.o span{font-size:.8rem;color:var(--ac);font-weight:700;white-space:nowrap}
</style></head>
<body><div id="app">
<h1>🏸 バドミントン団体戦 オーダー作成</h1>
<ol id="st"></ol><div id="v"></div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s),V=$('#v'),ST=$('#st');
const S={step:0,n:8,m:4,d:3,s:0,names:[],cnt:[],ck:'',rel:{},res:null};
const T=['人数・試合','名前','出場回数','組み合わせ','オーダー'];
const key=(a,b)=>a<b?a+'-'+b:b+'-'+a;
const R=(a,b)=>S.rel[key(a,b)]||0;
const K=()=>S.d*2+S.s,tot=()=>K()*S.m;
const spread=()=>{const t=tot(),b=t/S.n|0,r=t%S.n;return[...Array(S.n)].map((_,i)=>b+(i<r?1:0))};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rank=(l,c)=>l.map(x=>[x,c[x]+Math.random()*.99]).sort((a,b)=>b[1]-a[1]).map(a=>a[0]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm_=()=>[...Array(S.n)].map((_,i)=>S.names[i]||`選手${i+1}`);
const nav=t=>`<div class="row"><button id="bk">戻る</button><button class="pri" id="nx">${t}</button></div>`;
async function copy(t){
  try{await navigator.clipboard.writeText(t);return 1}
  catch(e){try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e2){return 0}}
}
function go(n){S.step=n;render()}
function render(){
  ST.innerHTML=T.map((t,i)=>`<li class="${i==S.step?'on':i<S.step?'done':''}"><b>${i+1}</b>${t}</li>`).join('');
  [p0,p1,p2,p3,p4][S.step]();scrollTo(0,0);
}
function p0(){
  V.innerHTML=`<h2>チームの人数と試合数</h2>
  <label>チームの人数（2〜20）<input id="n" type="number" min="2" max="20" value="${S.n}"></label>
  <label>試合数（1〜10）<input id="m" type="number" min="1" max="10" value="${S.m}"></label>
  <label>1試合あたりのダブルスの組数<input id="d" type="number" min="0" max="10" value="${S.d}"></label>
  <label>1試合あたりのシングルスの本数（なければ0）<input id="s" type="number" min="0" max="20" value="${S.s}"></label>
  <p class="mu" id="tt"></p>
  <p class="mu">1つの試合の中に、同じ選手を2回入れることはありません。</p>
  <p id="err" class="err"></p>
  <div class="row"><button class="pri" id="nx">次へ</button></div>`;
  const g=id=>+$('#'+id).value||0;
  const up=()=>{const d=g('d'),s=g('s'),m=g('m'),k=2*d+s;$('#tt').textContent=`1試合 ${k}人（ダブルス${d}組×2人＋シングルス${s}人）× ${m}試合 ＝ 延べ出場枠 ${k*m}`};
  V.querySelectorAll('input').forEach(e=>e.oninput=up);up();
  $('#nx').onclick=()=>{
    const n=g('n'),m=g('m'),d=g('d'),s=g('s'),k=2*d+s,ok=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;
    const e=!ok(n,2,20)?'人数は2〜20人で入力してください':!ok(m,1,10)?'試合数は1〜10で入力してください':
      !ok(d,0,10)||!ok(s,0,20)||k<1?'ダブルスの組数・シングルスの本数を正しく入力してください（1試合に最低1人必要です）':
      k>n?`1試合に${k}人必要ですが、チーム人数が${n}人です（同じ人は1試合に1回までなので、人数が足りません）`:'';
    if(e){$('#err').textContent=e;return}
    Object.assign(S,{n,m,d,s});go(1);
  };
}
function p1(){
  V.innerHTML=`<h2>選手の名前</h2><div class="g">${[...Array(S.n)].map((_,i)=>`<label>${i+1}人目<input data-i="${i}" maxlength="12" placeholder="選手${i+1}" value="${esc(S.names[i]||'')}"></label>`).join('')}</div><p id="err" class="err"></p>${nav('次へ')}`;
  V.querySelectorAll('input').forEach(el=>el.oninput=()=>{S.names[+el.dataset.i]=el.value.trim()});
  $('#bk').onclick=()=>go(0);
  $('#nx').onclick=()=>{
    const nm=nm_();
    if(new Set(nm).size<nm.length){$('#err').textContent='同じ名前の選手がいます。区別できる名前にしてください';return}
    go(2);
  };
}
function p2(){
  const nm=nm_(),mx=S.m,k=[S.n,S.m,S.d,S.s].join('-');
  if(S.ck!==k){S.ck=k;S.cnt=spread()}
  V.innerHTML=`<h2>それぞれの出場回数</h2><p class="mu">全員の合計が <b>${tot()}回</b>（1試合${K()}人 × ${S.m}試合）になるように入力してください。1人あたり最大${mx}回です（1試合につき1回まで）。</p><div class="g">${nm.map((x,i)=>`<label>${esc(x)}<input type="number" min="0" max="${mx}" data-i="${i}" value="${S.cnt[i]}"></label>`).join('')}</div><p id="sum"></p><p id="err" class="err"></p><div class="row"><button id="av">均等に割り振る</button></div>${nav('次へ')}`;
  const rd=()=>[...V.querySelectorAll('input')].map(e=>e.value===''?NaN:+e.value);
  const up=()=>{const t=rd().reduce((x,y)=>x+(y||0),0),el=$('#sum');el.textContent=`合計 ${t} / ${tot()}回`;el.style.color=t==tot()?'var(--ac)':'var(--no)'};
  V.querySelectorAll('input').forEach(el=>el.oninput=()=>{S.cnt[+el.dataset.i]=+el.value||0;up()});up();
  $('#av').onclick=()=>{S.cnt=spread();p2()};
  $('#bk').onclick=()=>go(1);
  $('#nx').onclick=()=>{
    const a=rd();
    if(a.some(v=>!Number.isInteger(v)||v<0)){$('#err').textContent='出場回数は0以上の整数で入力してください';return}
    if(a.some(v=>v>mx)){$('#err').textContent=`1人あたり最大${mx}回です（1試合に同じ人は2回入れられません）`;return}
    const t=a.reduce((x,y)=>x+y,0);
    if(t!=tot()){$('#err').textContent=`合計が${t}回です。${tot()}回に合わせてください（${t<tot()?`あと${tot()-t}回足りません`:`${t-tot()}回多すぎます`}）`;return}
    S.cnt=a;
    if(S.d)go(3);else{S.res=gen();go(4)}
  };
}
function p3(){
  const nm=nm_(),sym=['','○','×'];
  let h=`<h2>組ませたい・組ませたくない（ダブルス）</h2><p class="mu">マス目をタップするたびに「空白 → ○（組ませたい）→ ×（組ませたくない）」と切り替わります。</p><div class="mx"><table><tr><th></th>${nm.map(x=>`<th class="v">${esc(x)}</th>`).join('')}</tr>`;
  nm.forEach((x,i)=>{
    h+=`<tr><th>${esc(x)}</th>`;
    nm.forEach((_,j)=>{h+=i==j?'<td class="dg"></td>':`<td><button class="c c${R(i,j)}" data-k="${key(i,j)}">${sym[R(i,j)]}</button></td>`});
    h+='</tr>';
  });
  V.innerHTML=h+`</table></div><p class="mu">○ = 組ませたい　× = 組ませたくない</p>${nav('オーダーを作る')}`;
  V.querySelectorAll('.c').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,v=((S.rel[k]||0)+1)%3;S.rel[k]=v;
    V.querySelectorAll(`.c[data-k="${k}"]`).forEach(x=>{x.className='c c'+v;x.textContent=sym[v]});
  });
  $('#bk').onclick=()=>go(2);
  $('#nx').onclick=()=>{S.res=gen();go(4)};
}
function gen(){
  const {n,m,d}=S,k=K(),all=[...Array(n).keys()],want=[];
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(R(i,j)==1)want.push([i,j]);
  let best=[],bs=-1e9;
  for(let t=0;t<200;t++){
    const c=[...S.cnt],seen={},real=new Set(),rounds=[];let sc=0,fail=false;
    for(let r=0;r<m&&!fail;r++){
      const P=rank(all.filter(x=>c[x]>0),c).slice(0,k);
      if(P.length<k){fail=true;break}
      P.forEach(x=>c[x]--);
      let bt=null;
      for(let u=0;u<20;u++){
        const used=new Set(),ds=[];
        const w=shuf(want.filter(p=>P.includes(p[0])&&P.includes(p[1]))).sort((x,y)=>real.has(key(...x))-real.has(key(...y)));
        for(const [a,b] of w)if(ds.length<d&&!used.has(a)&&!used.has(b)){ds.push([a,b]);used.add(a);used.add(b)}
        const rest=shuf(P.filter(x=>!used.has(x)));
        while(ds.length<d&&rest.length>1){
          const x=rest.shift(),o=rest.map((y,i)=>[y,i]).filter(a=>R(x,a[0])!=2);
          if(!o.length)break;
          const f=o.filter(a=>!seen[key(x,a[0])]),L=f.length?f:o,[y,i]=L[Math.random()*L.length|0];
          rest.splice(i,1);ds.push([x,y]);
        }
        if(ds.length<d)continue;
        const rs=ds.reduce((a,p)=>a+(S.rel[key(...p)]==1&&!real.has(key(...p))?100:0)-(seen[key(...p)]?10:0),0);
        if(!bt||rs>bt.rs)bt={ds,sg:rest,rs};
      }
      if(!bt){fail=true;break}
      bt.ds.forEach(p=>{const q=key(...p);seen[q]=1;if(S.rel[q]==1)real.add(q)});
      sc+=bt.rs;rounds.push(bt);
    }
    if(fail)continue;
    if(sc>bs){bs=sc;best=[]}
    if(sc==bs)best.push({rounds,real:real.size});
  }
  if(!best.length)return null;
  const b=best[Math.random()*best.length|0];
  return{rs:shuf(b.rounds).map(o=>({ds:shuf(o.ds).map(p=>shuf(p)),sg:shuf(o.sg)})),real:b.real,wt:want.length};
}
function p4(){
  const r=S.res,nm=nm_(),N=i=>esc(nm[i]);
  let h='<h2>オーダー</h2>';
  if(!r)h+='<p class="err">条件を満たす組み合わせが見つかりませんでした。×を減らすか、出場回数を見直してください。</p>';
  else{
    const bn=nm.filter((_,i)=>!S.cnt[i]);
    h+=r.rs.map((o,i)=>`<h3>第${i+1}試合</h3>`
      +o.ds.map((p,j)=>`<div class="o"><span>ダブルス${j+1}</span><strong>${N(p[0])} ・ ${N(p[1])}</strong></div>`).join('')
      +o.sg.map((p,j)=>`<div class="o"><span>シングルス${j+1}</span><strong>${N(p)}</strong></div>`).join('')).join('')
      +(r.wt?`<p class="mu">組ませたい${r.wt}組のうち${r.real}組を反映しました。</p>`:'')
      +(bn.length?`<p class="mu">出場なし：${bn.map(esc).join('、')}</p>`:'')
      +'<div class="row"><button id="cp">テキストをコピー</button></div><p id="msg" class="mu"></p>';
  }
  V.innerHTML=h+`<div class="row"><button id="bk">条件に戻る</button><button class="pri" id="nx">もう一度組む</button></div><div class="row"><button id="rs">最初からやり直す</button></div>`;
  $('#bk').onclick=()=>go(S.d?3:2);
  $('#nx').onclick=()=>{S.res=gen();p4()};
  $('#rs').onclick=()=>{S.names=[];S.rel={};S.ck='';go(0)};
  if(r)$('#cp').onclick=async()=>{
    const t=r.rs.map((o,i)=>`【第${i+1}試合】\n`+o.ds.map((p,j)=>`ダブルス${j+1}：${nm[p[0]]}・${nm[p[1]]}`).concat(o.sg.map((p,j)=>`シングルス${j+1}：${nm[p]}`)).join('\n')).join('\n\n');
    $('#msg').textContent=await copy(t)?'コピーしました':'コピーできませんでした。画面から手動で控えてください';
  };
}
render();
})();
</script></body></html>
